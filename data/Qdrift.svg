<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4285F4"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EA4335"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34A853"/>
    </marker>
    <marker id="arrow-correct" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FBBC05"/>
    </marker>
    
    <filter id="blur">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="#fafafa" rx="12"/>
  <rect width="800" height="480" fill="none" stroke="#e0e0e0" stroke-width="2" rx="12"/>

  <line x1="80" y1="430" x2="720" y2="430" stroke="#bdc3c7" stroke-width="3" />
  <text x="100" y="460" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d" text-anchor="middle">T = T_max</text>
  <text x="400" y="460" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d" text-anchor="middle">Denoising Steps</text>
  <text x="700" y="460" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d" text-anchor="middle">T = 0</text>

  <path d="M 100 240 Q 300 60 680 120" fill="none" stroke="#4285F4" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  
  <path d="M 100 240 Q 350 380 680 360" fill="none" stroke="#EA4335" stroke-width="6" stroke-dasharray="12, 8" stroke-linecap="round" marker-end="url(#arrow-red)"/>
  
  <path d="M 100 240 Q 300 130 680 120" fill="none" stroke="#34A853" stroke-width="5" stroke-dasharray="15, 5" stroke-linecap="round" marker-end="url(#arrow-green)"/>

  <path d="M 250 300 L 250 170" fill="none" stroke="#FBBC05" stroke-width="4" marker-end="url(#arrow-correct)"/>
  <path d="M 400 350 L 400 120" fill="none" stroke="#FBBC05" stroke-width="4" marker-end="url(#arrow-correct)"/>
  <path d="M 550 365 L 550 125" fill="none" stroke="#FBBC05" stroke-width="4" marker-end="url(#arrow-correct)"/>

  <circle cx="100" cy="240" r="12" fill="#95a5a6"/>
  <text x="90" y="215" font-family="Arial" font-size="16" font-weight="bold" fill="#34495e" text-anchor="end">Pure Noise</text>
  <text x="90" y="270" font-family="Arial" font-size="24" fill="#bdc3c7" text-anchor="end">...</text>

  <rect x="350" y="40" width="160" height="30" rx="5" fill="#4285F4" fill-opacity="0.1"/>
  <text x="430" y="60" font-family="Arial" font-size="14" font-weight="bold" fill="#4285F4" text-anchor="middle">Full Precision (Ideal)</text>

  <rect x="470" y="150" width="160" height="30" rx="5" fill="#34A853" fill-opacity="0.1"/>
  <text x="550" y="170" font-family="Arial" font-size="14" font-weight="bold" fill="#34A853" text-anchor="middle">Q-Drift Corrected</text>

  <rect x="430" y="380" width="170" height="30" rx="5" fill="#EA4335" fill-opacity="0.1"/>
  <text x="515" y="400" font-family="Arial" font-size="14" font-weight="bold" fill="#EA4335" text-anchor="middle">Quantized (Drift Error)</text>

  <rect x="290" y="220" width="160" height="30" rx="5" fill="#FBBC05" fill-opacity="0.2"/>
  <text x="370" y="240" font-family="Arial" font-size="14" font-weight="bold" fill="#e67e22" text-anchor="middle">Drift Compensation</text>

  <rect x="700" y="80" width="70" height="70" rx="8" fill="#ecf0f1" stroke="#4285F4" stroke-width="2"/>
  <circle cx="735" cy="110" r="14" fill="#f1c40f"/>
  <polygon points="700,150 730,115 745,135 760,120 770,150" fill="#2ecc71"/>
  <text x="735" y="175" font-family="Arial" font-size="13" font-weight="bold" fill="#34495e" text-anchor="middle">High Quality</text>

  <g filter="url(#blur)">
    <rect x="700" y="320" width="70" height="70" rx="8" fill="#ecf0f1" stroke="#EA4335" stroke-width="2"/>
    <circle cx="735" cy="350" r="14" fill="#f1c40f"/>
    <polygon points="700,390 730,355 745,375 760,360 770,390" fill="#2ecc71"/>
  </g>
  <text x="735" y="415" font-family="Arial" font-size="13" font-weight="bold" fill="#EA4335" text-anchor="middle">Degraded</text>

</svg>
